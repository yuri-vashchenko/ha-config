title: Home
type: panel
layout:
  width: 300
  max_cols: 3
badges: []
cards:
  - type: custom:layout-card
    layout_type: horizontal
    layout:
      width: 300
    cards:
      - type: vertical-stack
        cards:
          - type: custom:mini-graph-card
            height: 75
            width: 300
            font_size: 200
            hour24: true
            decimals: 1
            entities:
              - sensor.street_thermometer_temperature
            color_thresholds:
              - value: 0
                color: "#CCE5FF"
              - value: 10
                color: "#66B2FF"
              - value: 18
                color: "#0080FF"
              - value: 20
                color: "#87c087"
              - value: 21
                color: "#389638"
              - value: 24
                color: "#FF9932"
              - value: 25
                color: "#FF8000"
              - value: 26
                color: "#ff0000"
          - type: custom:mini-graph-card
            height: 75
            decimals: 1
            hour24: true
            entities:
              - sensor.street_thermometer_humidity
          - type: horizontal-stack
            cards:
              - type: weather-forecast
                entity: weather.yandex_pogoda
                show_forecast: false
              - type: custom:compass-card
                header:
                  title:
                    value: Ветер
                    color: green # default color (for state is less than the lowest dynamic_style.bands.from_value)
                    dynamic_style:
                      sensor: sensor.yandex_pogoda_wind_speed
                      bands:
                        - from_value: 5
                          color: yellow
                        - from_value: 10
                          color: orange
                        - from_value: 15
                          color: red
                        - from_value: 20
                          color: purple
                  icon:
                    show: false
                indicator_sensors:
                  - sensor: sensor.yandex_pogoda_wind_bearing
                    indicator:
                      image: arrow_inward
                value_sensors:
                  - sensor: sensor.yandex_pogoda_wind_speed
                compass:
                  circle:
                    color: green # default color (for state is less than the lowest dynamic_style.bands.from_value)
                    dynamic_style:
                      sensor: sensor.yandex_pogoda_wind_speed
                      bands:
                        - from_value: 5
                          color: yellow
                        - from_value: 10
                          color: orange
                        - from_value: 15
                          color: red
                        - from_value: 20
                          color: purple
                language: ru
      - type: vertical-stack
        cards:
          - type: custom:clock-weather-card
            entity: weather.yandex_pogoda
            title: Погода во Владивостоке
            sun_entity: sun.sun
            temperature_sensor: sensor.street_thermometer_temperature
            weather_icon_type: fill
            animated_icon: true
            forecast_rows: 24
            locale: ru
            time_format: 24
            date_pattern: ccc, d.MM.yy
            hide_today_section: false
            hide_forecast_section: false
            hide_clock: false
            hide_date: false
            hourly_forecast: true
            use_browser_time: true
      - type: vertical-stack
        cards:
          - type: entity-filter
            entities:
              - person.elena_vashchenko
              - person.yuri_vashchenko
              - person.svetlana_vashchenko
              - person.mikhail_vashchenko
              - person.oleg_vashchenko
              - person.galina_vashchenko
              - person.alexey_vashchenko
            conditions:
              - condition: state
                state: home
            card:
              type: glance
              title: Пользователи дома
          - type: entity-filter
            entities:
              - entity: button.smartintercom_ru_propustit
                name: "Пропустить"
                tap_action:
                  action: button.smartintercom_ru_propustit.press
              - entity: button.smartintercom_ru_kurer
                name: "Пропустить курьера"
                tap_action:
                  action: button.smartintercom_ru_kurer.press
              - entity: button.smartintercom_ru_otkazat
                name: "Отказать"
                tap_action:
                  action: button.smartintercom_ru_otkazat.press
            card:
              type: glance
              show_state: false

              title: Домофон
            conditions:
              - condition: state
                state_not: unavailable
          - type: tile
            entity: switch.smartintercom_ru_otkryvat_kureru_na_sleduiushchii_zvonok
            name: "Открывать курьеру на следующий звонок"
            tap_action:
              action: toggle
          - type: tile
            entity: switch.smartintercom_ru_otkryvat_na_sleduiushchii_zvonok
            name: "Открывать на следующий звонок"
            tap_action:
              action: toggle
          - type: tile
            entity: switch.smartintercom_ru_otkryvat_vsegda
            name: "Открывать всегда"
            tap_action:
              action: toggle
          - type: tile
            entity: switch.smartintercom_ru_vsegda_sbrasyvat
            name: "Всегда сбрасывать"
            tap_action:
              action: toggle
