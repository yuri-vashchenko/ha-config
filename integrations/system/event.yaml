template:
  - sensor:
      - name: smoke_detected
        state: >
          {% set ns = namespace(alarms = []) %}
          {% for entity in states.binary_sensor
                if is_state_attr(entity.entity_id, 'device_class', 'smoke') and
                  is_state(entity.entity_id, 'on') %}
                  {% set ns.alarms = ns.alarms + [entity.name] %}
          {% endfor %}
          {{ ns.alarms | length }}
        attributes:
          list_entities: >
            {% set ns = namespace(alarms = []) %}
            {% for entity in states.binary_sensor
                if is_state_attr(entity.entity_id, 'device_class', 'smoke') and
                  is_state(entity.entity_id, 'on') %}
                  {% set ns.alarms = ns.alarms + [entity.name] %}
            {% endfor %}
            {{ ns.alarms }}

      - name: water_leak_detected
        state: >
          {% set ns = namespace(alarms = []) %}
          {% for entity in states.binary_sensor
                if is_state_attr(entity.entity_id, 'device_class', 'smoke') and
                  is_state(entity.entity_id, 'on') %}
                  {% set ns.alarms = ns.alarms + [entity.name] %}
          {% endfor %}
          {{ ns.alarms | length }}
        attributes:
          list_entities: >
            {% set ns = namespace(alarms = []) %}
            {% for entity in states.binary_sensor
                if is_state_attr(entity.entity_id, 'device_class', 'smoke') and
                  is_state(entity.entity_id, 'on') %}
                  {% set ns.alarms = ns.alarms + [entity.name] %}
            {% endfor %}
            {{ ns.leak_alarms }}

script:
  trigger_event:
    alias: "Trigger alarm, warning or notification"
    sequence:
      - alias: "main control"
        condition: state
        entity_id: input_boolean.main_control
        state: "on"
      - alias: "Iterate over notifications, warnings and errors"
        repeat:
          for_each:
            - set_notification
            - set_warning
            - set_alarm
          sequence:
            - alias: "Generate list of scripts"
              variables:
                scripts: >
                  {% set ns = namespace(scripts = []) %}
                  {% for s in states.script %}
                    {% if repeat.item in s.object_id %}
                      {% set ns.scripts = ns.scripts + [s.object_id] %}
                    {% endif %}
                  {% endfor %}
                  {{ ns.scripts }}
            - alias: "Run all scritps"
              repeat:
                for_each: "{{ scripts }}"
                sequence:
                  - action: script.turn_on
                    target:
                      entity_id: "script.{{ repeat.item }}"

  cancel_all:
    sequence:
      - alias: "Cancel all"
        sequence:
          - repeat:
              for_each:
                - counter.alarms
                - counter.warnings
                - counter.notifications
              sequence:
                - alias: "turn off everything"
                  action: counter.set_value
                  target:
                    entity_id: "{{ repeat.item }}"
                  data:
                    value: 0
          - repeat:
              for_each:
                - bathroom/water_leak
                - toilet/water_leak
                - kitchen/water_leak
                - kitchen/smoke_detector
              sequence:
                - alias: "Publish mqtt off"
                  action: mqtt.publish
                  data:
                    payload: "off"
                    topic: "home/{{ repeat.item }}"
                    retain: false
          - repeat:
              for_each:
                - alarm
                - warning
                - notification
              sequence:
                - alias: "Publish mqtt 0"
                  action: mqtt.publish
                  data:
                    payload: 0
                    topic: "home/system/{{ repeat.item }}/count"
                    retain: true
    mode: queued
    max: 100

automation:
  - id: trigger alarm when smoke or water leak detected
    alias: Включить тревогу при срабатывании датчика дыма или датчика протечки
    trigger:
      - trigger: state
        entity_id: sensor.smoke_detected
        id: smoke
      - trigger: state
        entity_id: sensor.water_leak_detected
        id: water_leak
    condition:
      - alias: "Main control is on"
        condition: state
        entity_id: input_boolean.main_control
        state: "on"
    action:
      - alias: "Обновить счётчик тревог"
        action: counter.set_value
        target:
          entity_id: counter.alarms
        data:
          value: >
            {{ states('sensor.smoke_detected') | int(0) + states('sensor.water_leak_detected') | int(0) }}
    mode: restart

  - id: trigger event
    alias: Запустить или выключить режим тревоги, предупреждения или нотификации
    trigger:
      - trigger: state
        entity_id: counter.notifications
      - trigger: state
        entity_id: counter.warnings
      - trigger: state
        entity_id: counter.alarms
    condition:
      - alias: "Main control is on"
        condition: state
        entity_id: input_boolean.main_control
        state: "on"
    action:
      - alias: "Запустить скрипт для генерации или отключения события"
        action: script.trigger_event
    mode: queued

  - id: cancel_all_on_button_press
    alias: cancell all on button press
    trigger:
      - trigger: state
        entity_id: input_button.cancel_all
        to: "PRESSED"
    condition:
      - alias: "control mode"
        condition: state
        entity_id: input_boolean.main_control
        state: "on"
    action:
      alias: "Cancell all alarms, notifications and warnings"
      action: script.cancel_all
